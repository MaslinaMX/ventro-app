name: ventro_app
description: Ventro POS - Sistema de Punto de Venta
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.0

  # Estado
  provider: ^6.1.0

  # Navegación
  go_router: ^13.0.0

  # Storage local
  shared_preferences: ^2.2.0

  # UI
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
